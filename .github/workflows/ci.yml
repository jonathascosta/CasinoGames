name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The documents name the last commit that changed the engine.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same gates as the pre-commit hook.
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Rules of Play, Math Reports, results.json and the pack match the code
        run: pnpm docs:check
      - run: pnpm build
      - name: Built engine runs on plain Node (server-side smoke test)
        run: pnpm --filter @casinogames/engine smoke

  submission-pack:
    name: Submission pack PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prints docs/SUBMISSION-PACK.pdf afresh with the runner's Chrome; the
      # check then confirms every document, and the PDF's build, still match.
      - run: pnpm docs:generate
      - run: pnpm docs:check
      - uses: actions/upload-artifact@v7
        with:
          name: submission-pack
          path: docs/SUBMISSION-PACK.pdf
          if-no-files-found: error

  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Every page at 90 or more for performance and accessibility, measured
      # as a phone, with the runner's Chrome.
      - run: pnpm lighthouse

  math:
    # Each simulation must reproduce the results it recorded, which the Math Reports quote.
    name: Monte Carlo suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:math

  node-compat:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The supported floor (package.json engines) and the current LTS.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @casinogames/engine build
      - run: pnpm --filter @casinogames/engine smoke
